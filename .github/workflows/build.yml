name: Build Windows Installer

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 打 tag 时创建 Release；失败时推送 ci-logs 分支

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build installer
        run: |
          npm run dist -- --publish never *> build-out.txt
          exit $LASTEXITCODE
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          DEBUG: electron-builder,electron-builder:npm

      - name: Push build log to ci-logs branch (failure only)
        if: failure()
        run: |
          git config user.name "ci-log"
          git config user.email "ci@example.com"
          git checkout --orphan ci-logs
          git add -f build-out.txt
          git commit -m "CI build log"
          git push -f origin ci-logs

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            release-build/*.exe
            release-build/*.blockmap
            release-build/latest.yml
          retention-days: 14
          if-no-files-found: error

      - name: Create release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-build/*.exe
            release-build/*.blockmap
            release-build/latest.yml
